name: Desktop app

# Builds Focus Overlay (desktop/) for Mac on GitHub's Mac runner: one app for
# Apple Silicon and Intel Macs, signed "ad hoc" (there is no Apple developer
# account, so macOS asks once before opening it), zipped. A change to desktop/ on
# main publishes it as the "Focus Overlay for Mac" release, so the download link
# stays the same:
#   https://github.com/homiejhan/worky/releases/download/desktop-latest/Focus-Overlay-mac.zip
# On other branches the zip is kept with the run (Actions → the run → Artifacts).
# The app shows the live site, so changes to Focus itself need no new build.

on:
  push:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install
        working-directory: desktop
        run: npm ci

      - name: Build (Apple Silicon and Intel, in one app)
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:mac

      - name: Sign ad hoc, check, zip
        run: |
          APP="desktop/dist/mac-universal/Focus Overlay.app"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          lipo -archs "$APP/Contents/MacOS/Focus Overlay"
          /usr/libexec/PlistBuddy -c "Print :LSUIElement" "$APP/Contents/Info.plist"
          ditto -c -k --sequesterRsrc --keepParent "$APP" Focus-Overlay-mac.zip
          ls -lh Focus-Overlay-mac.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Focus-Overlay-mac
          path: Focus-Overlay-mac.zip
          retention-days: 30

      - name: Publish the release (main only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete desktop-latest --yes --cleanup-tag || true
          gh release create desktop-latest Focus-Overlay-mac.zip \
            --target "$GITHUB_SHA" \
            --title "Focus Overlay for Mac" \
            --notes "Focus as a round button above every window: click it for your timers and today's tasks. Unzip, move Focus Overlay to Applications, then the first time right-click it and choose Open (on macOS 15 and later: open it once, then System Settings → Privacy & Security → Open Anyway). How to use it: https://homiejhan.github.io/worky/help/#overlay"
